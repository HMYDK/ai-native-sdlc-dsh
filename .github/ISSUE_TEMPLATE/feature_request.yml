name: 功能建议
description: 提出新的能力、改进或文档建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        这个插件负责「Agent 如何工作」；发布授权、分支保护、密钥管理和合规管控属于 Git、CI 和 RBAC，
        不在本项目范围内（见 README 末尾的边界说明）。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在的做法哪里不够用？尽量给具体场景，而不是直接给方案。
      placeholder: 每次……都要手动……，因为……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述你希望发生什么。如果涉及新的工具或状态，请说明它与现有流程的关系。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括你排除掉的方案和原因，避免重复讨论。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 可多选。
      multiple: true
      options:
        - 任务状态机与制品链
        - 独立验证与测试冻结
        - 看板与界面
        - 工作流 Skill
        - RSI 复盘
        - 安装与打包
        - 文档
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: 你能参与哪一步
      options:
        - 我可以提交 PR
        - 我可以帮助测试
        - 暂时只能提建议
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 相关 issue、截图、DSH 版本，或你已有的验证读数。
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 issue 和文档，确认这不是已有能力或重复建议
          required: true
