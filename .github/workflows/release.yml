name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: pack and publish tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace packages/sdlc

      - name: Pack
        id: pack
        run: |
          TGZ="$(npm pack --workspace packages/sdlc --silent)"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "packed $TGZ"

      - name: Checksums
        run: |
          TGZ="${{ steps.pack.outputs.tgz }}"
          sha256sum "$TGZ" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.pack.outputs.tgz }}" \
            SHA256SUMS.txt
