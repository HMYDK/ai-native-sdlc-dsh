name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: verify / publish / pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./packages/sdlc/package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 packages/sdlc/package.json 的 v$VERSION 不一致"
            exit 1
          fi

      - name: Build
        run: npm run build --workspace packages/sdlc

      - name: Pack
        id: pack
        run: |
          TGZ="$(npm pack --workspace packages/sdlc --silent)"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "packed $TGZ"

      - name: Checksums
        run: |
          TGZ="${{ steps.pack.outputs.tgz }}"
          sha256sum "$TGZ" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace packages/sdlc --access public --provenance

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.pack.outputs.tgz }}" \
            SHA256SUMS.txt
