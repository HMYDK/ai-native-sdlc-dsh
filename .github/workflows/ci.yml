name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  evals-check:
    name: featurebench data checks / dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker deps
        run: pip install pyyaml

      # 只做数据一致性校验与 dry-run：不调模型、不起容器、不拉镜像、不联网。
      - name: Manifest structural check
        run: python3 tools/evals/featurebench/sanity_check.py --structural

      # AC-VALIDITY-1C：主实验 5x2=10 与 B1 3x1=3 的确定性计划/身份检查；
      # 以及六类离线 fixture 的物化与可执行行为检查。均不调模型、不起容器。
      - name: AC-VALIDITY-1C preflight self-test
        run: python3 tools/evals/featurebench/check_ac_validity_1c.py --self-test

      - name: AC-VALIDITY-1C Phase 1 docs consistency
        run: |
          python3 tools/evals/featurebench/fixtures/ac-validity-1c/check_phase1_docs.py --self-test
          python3 tools/evals/featurebench/fixtures/ac-validity-1c/check_phase1_docs.py

      - name: AC-VALIDITY-1C fixture workdir guard (twice)
        run: |
          python3 tools/evals/featurebench/fixtures/ac-validity-1c/check_fixtures.py --self-test
          python3 tools/evals/featurebench/fixtures/ac-validity-1c/check_fixtures.py --self-test

      - name: AC-VALIDITY-1C offline fixtures
        run: python3 tools/evals/featurebench/fixtures/ac-validity-1c/check_fixtures.py --workdir /tmp/validity-1c-fixtures

      - name: AC-VALIDITY-1C Phase 1 frozen plan
        run: |
          python3 tools/evals/featurebench/fixtures/ac-validity-1c/phase1/check_phase1_plan.py --self-test
          python3 tools/evals/featurebench/fixtures/ac-validity-1c/phase1/check_phase1_plan.py --fixtures-root /tmp/validity-1c-fixtures
          python3 tools/evals/featurebench/fixtures/ac-validity-1c/phase1/check_phase1_plan.py --dirty-workspace-test --fixtures-root /tmp/validity-1c-fixtures
          python3 tools/evals/featurebench/fixtures/ac-validity-1c/phase1/check_phase1_plan.py --stage-prompts /tmp/validity-1c-prompts
          bash -n tools/evals/featurebench/fixtures/ac-validity-1c/phase1/run_isolated.sh
          python3 -m py_compile tools/evals/featurebench/fixtures/ac-validity-1c/phase1/check_workspace_session.py
          python3 -m py_compile tools/evals/featurebench/fixtures/ac-validity-1c/phase1/check_verifier_snapshot.py
          python3 tools/evals/featurebench/fixtures/ac-validity-1c/phase1/check_verifier_snapshot.py --self-test

      - name: Baseline index check
        run: python3 tools/evals/featurebench/sanity_check.py --index

      - name: Run inventory audit (canonical runs.jsonl)
        run: python3 tools/evals/featurebench/audit_runs.py --check

      - name: Reaggregate cross-check (offline recompute)
        run: python3 tools/evals/featurebench/reaggregate.py --check

      - name: Redaction check (host paths / credentials)
        run: python3 tools/evals/featurebench/check_redaction.py

      # 回归：缺官方 resolved 的配对不能被算成 A_only/B_only/neither
      # （Codex review 2026-11-11 P2；不读 runs、不需要 zstandard/网络/模型）。
      - name: VERIFY-01 A/B aggregator self-test
        run: python3 tools/evals/verify01/summarize_ab.py --self-test

      - name: Dry-run single arm
        run: |
          python3 tools/evals/featurebench/run_arm.py \
            --task-id "$(python3 - <<'PY'
          import yaml
          m = yaml.safe_load(open('tools/evals/featurebench/manifest.yml'))
          print(m['tasks'][0]['id'])
          PY
          )" \
            --arm standard --mode empty --image fb-eval-base:packaging --out /tmp/dry-run-arm

      - name: Dry-run matrix
        run: |
          python3 tools/evals/featurebench/run_matrix.py \
            --manifest tools/evals/featurebench/manifests/verify-calibration.yml \
            --runs-root /tmp/dry-run-matrix --plugin-dir /tmp/no-plugin --credentials /tmp/no-creds
