# 实验⑤（第三轮）：重复采样，估计运行方差（2026-11-08，首次运行前固定）。
# 背景：MVP/②/③/④ 的单次采样结论方向不一致（③ -0.1，④ +0.18），需要用重复运行
# 先估计同一任务同一 arm 的方差，再谈 treatment effect。
# 选 3 个 MVP 任务：packaging（天花板对照，两臂此前都过）、seaborn test_algorithms
# （MVP 中 B 超时但补丁通过、③ 中 sdlc_guidance patch=0）、sphinx build_gettext
# （MVP 两臂失败、② stress 1/3 通过、③ 只有 standard 通过）——后两个是观测到混合
# 结果/高方差的任务，选它们是为了让方差可测；packaging 作为天花板对照。
# 每任务每臂重复 3 次，用 3 个独立 runs-root（rep1/2/3）实现：每 rep 是一次完整矩阵。
# 单 run 45min / 40M token 上限不变；总预算 300M（1B 预算剩余约 320M）。
