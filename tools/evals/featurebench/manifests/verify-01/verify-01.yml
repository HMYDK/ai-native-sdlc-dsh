  - "astropy__astropy.b0db0daa.test_basic_rgb.067e927c.lv1"
  - "astropy__astropy.b0db0daa.test_comparison.445d81a3.lv1"
  - "astropy__astropy.b0db0daa.test_compressed.8daeb7d6.lv1"

