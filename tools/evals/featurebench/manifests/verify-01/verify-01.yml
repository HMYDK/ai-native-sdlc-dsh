# 每 run 必须记录（run_arm.py 的 meta.json + 官方 report.json）：
record_per_run:
  - task_id, arm, preset, role
  - model_provider, model, reasoning_effort
  - dsh_cli (请求值/实际值), plugin_version (请求值/实际值), plugin_tarball_sha256
  - plugin_imported_from（--plugin-dir 实际路径，A/B 不同解包目录）
  - image, image_digest, derived_image
  - started_at, elapsed_seconds, token_usage (+ token_usage_source)
  - agent_completed, agent_failure, aborted
  - patch_chars, patch_sha256
  - official: report_sha256, resolved, pass_rate, errors, not_applied_empty
  - verify_verdicts（sdlc_verify 裁决序列；无裁决记 none）
  - leak_scan_hits

