# 回答「升级到 0.6.1/0.2.2 后结论是否改变」；与新版本数据比较时不要与旧版本混算。
version: 1
date: '2026-11-08'
benchmark:
  name: FeatureBench
  package: featurebench==0.3.0
  dataset: LiberCoders/FeatureBench
  revision: 76b4a4566e04f4bcc13c35125d4f301791efa736
  split: fast
runtime:
  dsh_cli: 0.2.2-rc.1
  plugin_package: '@ai-native-sdlc-plugin/dsh-sdlc'
