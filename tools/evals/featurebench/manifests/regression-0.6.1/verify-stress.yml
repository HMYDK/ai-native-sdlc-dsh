  base_os: Ubuntu 22.04.5 / Python 3.11 / conda testbed env
  node_in_container: v24.21.0 (linux-x64 tarball, baked into fb-eval-base)
  provider: deepseek-account
  model: deepseek-flash
  reasoning_effort: max
arms:
  sdlc:
    preset: AI 原生 SDLC
    prompt_suffix: '

      ## Evaluation requirement


      Use the AI-native SDLC workflow for this task before you finish:

      1. create a task with `sdlc_task_create`;

