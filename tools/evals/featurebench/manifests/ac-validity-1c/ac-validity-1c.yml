independent_tasks:
  - "sympy__sympy.c1097516.test_inverse.c240ffe7.lv1"
  - "sympy__sympy.c1097516.test_nullspace.f14fc970.lv1"
  - "sympy__sympy.c1097516.test_puiseux.cd575f09.lv1"

diagnostics:
  - "sphinx-doc__sphinx.e347e59c.test_build_gettext.2721e644.lv1"
  - "sphinx-doc__sphinx.e347e59c.test_ext_doctest.530dec5f.lv1"

selection_rule: >-
  fast split 中 repo=sympy/sympy 的 lv1 任务共 5 个，按 instance_id 字典序取前 3 个
  （test_inverse / test_nullspace / test_puiseux）；三者均满足 F2P 测试函数 ≥3、
  均含 Interface Description、均不在 canonical 历史 runs。diagnostics 固定为 2 个
  sphinx 回归任务，不进入独立收益分母。预注册后不得按结果替换任务或阈值。
  sympy 官方镜像 10.65GB；Phase 0 不拉取，运行前用 DSH 0.2.2-rc.3 rebake 派生镜像。

# ---- Phase 1：离线 fixture 的 6 次 verifier 调用（单独批准；≤8M / 2h）----
phase1:
  status: "pending_approval"
  arms:
    A_phase1:
      commit: "085c8fd"
      role: "baseline"
    B_phase1:
      commit: "5ee68cd"
      role: "candidate"
  scenarios: [1, 2, 3]      # #21 场景 1/2/3：正向通过、明确缺口、范围外独立失败
  calls: 6                  # 3 场景 × 2 臂
  max_tokens_per_call: 2000000
  total_token_budget: 8000000
  wall_clock_budget_seconds: 7200
  model: "deepseek-account/deepseek-flash"
  lock: >-
    同一场景的 Source、Spec/AC、Delivery Contract、代码快照、环境、工具面完全一致；
    唯一替换 baseline/candidate verifier prompt。记录 run_id、verdict、findings、
    工具执行、token、耗时；人工复核 finding 是否可复现。
  claims: >-
    不作显著性或普遍有效性声称；不把 needs_human 增多当成功；不把结构合规当质量。

# ---- B1：条件性消融，指向单独 manifest（主实验不包含 B1）----
b1_ablation:
  manifest: "ac-validity-1c-b1.yml"
  arm_key: "B1"
  commit: "085c8fd"
  plugin_tarball_sha256: "106247171248772794bd0ac99fa20ea9e2ff42d29d04a79e3032241158d27784"
  tasks:
    - "sympy__sympy.c1097516.test_inverse.c240ffe7.lv1"
    - "sympy__sympy.c1097516.test_nullspace.f14fc970.lv1"
    - "sympy__sympy.c1097516.test_puiseux.cd575f09.lv1"
  runs: 3
  max_tokens_per_run: 10000000
  total_token_budget: 30000000
  wall_clock_budget_seconds: 7200
  status: "draft_threshold_pending_approval"
  trigger_threshold: >-
    仅当 Phase 2 主实验满足以下全部条件才触发 B1：
    (a) 3 个新任务全部完成 A 与 B2 的配对，且 3 个任务均通过 gold/empty control；
    (b) 3 个新任务的 Source 与官方 Grader 无已知冲突（官方 resolved 与人工 Source 层
        gold 方向一致；有冲突的任务只作旁证，不触发）；
    (c) A 在 3 个新任务上至少有 1 个已确认的 Source 层错误放行，且 B2 为 0；
    (d) B2 没有引入已确认的 Source 层错误拒绝（A reject + resolved vs B2 相反）；
    (e) B1 预算 ≤30M / 2h 已单独批准。
    若 (c) 不成立（A/B2 都是 0 或相同），不触发 B1，报告“无信号/不可归因”；
    若 (d) 成立，不触发 B1，先报告 guardrail 回归。
  interpretation: >-
    B1 只能回答“旧 verifier + #20 是否已经足够”；不能把 B1 的改善直接归因给 #21，
    也不能在 B1 未触发时声称 #20 无效。

stop_rules:
  - "任一 phase 达到 token 上限或墙钟上限：立即停止该 phase，保留已产生 run，报告未完成数。"
  - "phase1 单次调用超过 2M token 或 2h 总墙钟：停止，不重试。"
  - "phase2 主实验单 run 超过 40M token 或单 run 2700s：按失败记录（ITT），不重试。"
  - "B1 单 run 超过 10M token 或 2h 总墙钟：停止，不重试。"
  - "同一 task/arm 连续 2 次 infra_error：停止该 phase，先修环境；不把 infra 失败算作效果。"
  - "官方 gold/empty control 失败的任务：不进入效果分母，单列 unscoreable 并报告。"
  - "分支保护/凭据/镜像/工具链阻塞：停止并报告，不绕过。"

decision_rules:
  keep: >-
    B2 在 3 个新任务上减少已确认的 Source 层错误放行（按 task 去重至少少 1 个），
    且没有增加已确认的 Source 层错误拒绝；needs_human/无裁决/token/墙钟的增量在
    预注册可接受范围内（不出现系统性超时或超过 phase 预算）。
  rework: >-
    出现混合结果（例如 B2 减少 1 个错误放行但新增 1 个错误拒绝），或成本/返工明显
    上升；先修 verifier/流程，再决定是否重跑（重跑需新预算批准，不能悄悄复用旧结论）。
  revert: >-
    B2 没有减少 Source 层错误放行，或增加了已确认的 Source 层错误拒绝/无裁决，
    或成本超出 phase 预算；记录 revert 理由与证据。
  no_claim: >-
    样本小（3 个新任务），零错误放行不能证明改善；不计算显著性、不外推；
    官方 resolved 只作旁证；needs_human 增加不是成功。

approval:
  phase0: "已批准（离线工作；唯一付费调用是本轮 1 次 sdlc_verify，≤2M/30min；不拉镜像、不安装评测依赖）。"
  re_verify: "Phase 0 整改后的第二次独立验证已由用户批准：1 call / ≤2M token / ≤30min / 不重试。"
  phase1: "未批准；需维护者单独批准 ≤8M / 2h / 6 calls / 单次 ≤2M。"
  phase2: "未批准；需维护者单独批准主实验 ≤120M / 8h。"
  b1: "未批准；需在 Phase 2 前批准阈值与 ≤30M / 2h。"
  human_gold: "审查者最终核对；不得用 A/B Actor 生成的 Spec/Delivery Contract/Verifier 裁决代替。"
