# AC-VALIDITY-1C（issue #22）主实验预注册清单 —— Phase 2 A vs B2。
#
# 本文件是 Phase 0 整改稿；Phase 1 / Phase 2 的付费授权**尚未批准**。
# 在获得维护者批准前，不得用 --execute 运行任何真实模型调用。
#
# 主实验（本文件）：
#   - A  = master@920b0eb（0.6.2 基线；AI 原生 SDLC preset + 旧插件构建）
#   - B2 = dev@5ee68cd（#20 Delivery Contract + #21 verifier）
#   - 5 个任务（3 个独立 sympy + 2 个 sphinx 诊断）× 2 臂 = **10 个计划 run**
#   - 历史诊断只作回归锚点，不进入独立收益分母；官方 resolved 只作旁证。
#
# B1 条件性消融**不**在本文件 arms 里：
#   - 见 `ac-validity-1c-b1.yml`；只有 3 个独立 sympy 任务 × B1 = 3 runs。
#   - 触发阈值与 ≤30M / 2h 预算在 Phase 2 前单独批准；不得用 --only-arm 临时
#     筛选代替预注册的两份计划。
#
# 每臂插件身份（commit → npm pack → sha256 → 解包目录）：
#   - A ：920b0eb → 40172ed2067b36e07fb2791a57a091240fbc8519140574f2b707d33aed87b0c1
#   - B2：5ee68cd → 8bb74f3a8bc20be10b2b2cd704cdf6f081e64fa70a812c6d124c4823faedb404
#   - B1：085c8fd → 106247171248772794bd0ac99fa20ea9e2ff42d29d04a79e3032241158d27784
#   （Phase 0 离线打包；Phase 1/2 运行前必须重新核对 tarball hash 与解包目录，
#    不允许用 --allow-version-mismatch 绕过 hash/身份不一致。）
#
# 任务选择（运行前固定，禁止按结果挑）：
#   - 新任务：fast split 中 repo=sympy/sympy 的 lv1 任务共 5 个，按 instance_id
#     字典序取前 3 个（test_inverse / test_nullspace / test_puiseux）；三者 F2P
#     测试函数均 ≥3、均含 Interface Description；均未出现在 canonical 历史 runs。
#     官方镜像 10.65GB（维护者确认；Phase 0 不拉取；运行前按 bake_base.py 用
#     DSH 0.2.2-rc.3 rebake 派生镜像）。
#   - 诊断任务：固定 2 个历史 sphinx 任务，只作回归/链路锚点。
#
# 运行顺序（预注册）：Phase 1（3 场景 × 2 臂）→ 本文件主实验（5 任务 × 2 臂，
# 交替顺序）→ 若 B1 阈值触发且单独获批，再按 ac-validity-1c-b1.yml 跑 3 runs。
# 每任务每臂 1 rep；不做显著性宣称。

version: 2
date: "2026-11-15"

benchmark:
  name: FeatureBench
  package: "featurebench==0.3.0"
  dataset: LiberCoders/FeatureBench
  revision: "76b4a4566e04f4bcc13c35125d4f301791efa736"   # v1.1；split fast 100 条
  split: fast

runtime:
  # 2026-11-15 环境核对：本机 DSH App 0.2.2-rc.3；Phase 0 不启动它。
  dsh_cli: "0.2.2-rc.3"
  plugin_package: "@ai-native-sdlc-plugin/dsh-sdlc"
  plugin_version: "0.6.2"
  plugin_tarball_sha256: "40172ed2067b36e07fb2791a57a091240fbc8519140574f2b707d33aed87b0c1"
  base_os: "Ubuntu 22.04.5 / Python 3.11 / conda testbed env"
  node_in_container: "v24.21.0 (linux-x64 tarball; rebake into fb-eval-rc3:<repo>)"
  image_tag_scheme: "fb-eval-rc3:<repo>"
  provider: "deepseek-account"
  model: "deepseek-flash"
  reasoning_effort: "max"

# A 臂的实际定义：AI 原生 SDLC preset + 0.6.2 基线插件构建（不是标准 preset；
# 也不是“注入一个不会生效的插件”）。B2 用同一 preset + #20/#21 构建；preset 与
# prompt_suffix 逐字相同，唯一受控差异是插件构建。
arms:
  A:
    preset: "AI 原生 SDLC"
    role: "baseline"
    commit: "920b0eb"
    plugin_tarball: "pkgs/A/ai-native-sdlc-plugin-dsh-sdlc-0.6.2.tgz"
    plugin_tarball_sha256: "40172ed2067b36e07fb2791a57a091240fbc8519140574f2b707d33aed87b0c1"
    plugin_dir: "plugins/A"
    plugin_version: "0.6.2"
    dsh_cli: "0.2.2-rc.3"
    notes: "master 0.6.2；无 Delivery Contract、旧 verifier prompt。"
  B2:
    preset: "AI 原生 SDLC"
    role: "candidate"
    commit: "5ee68cd"
    plugin_tarball: "pkgs/B2/ai-native-sdlc-plugin-dsh-sdlc-0.6.2.tgz"
    plugin_tarball_sha256: "8bb74f3a8bc20be10b2b2cd704cdf6f081e64fa70a812c6d124c4823faedb404"
    plugin_dir: "plugins/B2"
    plugin_version: "0.6.2"
    dsh_cli: "0.2.2-rc.3"
    notes: "dev；#20 + #21；与 A 的联合效果只能报联合效果。"

# Phase 2 主实验的镜像映射（run_matrix.py 仍要用 --image-map 显式传入；
# 本字段供 preflight/自检对账，不替代 CLI 参数）。
image_map:
  sphinx-doc/sphinx: "fb-eval-rc3:sphinx"
  sympy/sympy: "fb-eval-rc3:sympy"

run_policy:
  timeout_seconds: 2700          # 单 run 45 分钟，与历史一致
  max_tokens_per_run: 40000000   # UI 口径；超限中止并记录
  total_token_budget: 120000000  # 主实验全部 scored runs 累计 ≤120M
  wall_clock_budget_seconds: 28800  # 主实验 ≤8h
  infra_retries: 1               # 仅基础设施错误重试 1 次，前后都记录
  agent_retries: 0               # agent 失败/超时/unresolved 不重试
  reps_per_arm: 1
  order: alternating             # 奇数任务先 A，偶数任务先 B2；记录顺序
  failure_classes: [timeout, over_budget, infra_error, empty_patch, agent_error, unresolved]

plan:
  tasks: 5
  arms: ["A", "B2"]
  runs: 10
  independent_tasks: 3
  diagnostic_tasks: 2
  b1_manifest: "ac-validity-1c-b1.yml"
  b1_runs: 3

metrics:
  primary: >-
    Source 层错误放行：verdict=approve 但原始 Source 承诺的用户目标未交付；
    由独立审查者按 Source/Outcome/Oracle 人工裁定，不看官方 resolved 单一分数。
    按 task 去重报数；同时报 run 级原始计数、decided 分母与 ITT 分母。
  secondary:
    - "Source 层错误拒绝（人工；与 FN 对照）"
    - "needs_human 数与原因分布"
    - "无裁决/超时/空补丁数（ITT 与 decided 分列）"
    - "scope 冲突处理正确性（out-of-scope 是否被误当免责/扩需求）"
    - "Token / 墙钟 / 每次返工与复验次数"
    - "验收缺口识别率（人工复核 finding 是否指向缺失 AC）"
    - "finding 可复核率（人工按命令复跑）"
    - "官方 resolved / pass_rate（旁证单列，不与 Source 层混算）"
  denominator: >-
    ITT：所有实际启动且进入 agent 的 run 都计入，含失败、超时、超预算、空补丁；
    缺官方 report 的 run 在 ITT 下按 unresolved 计入并单列 unscoreable。
    decided：只含拿到结构化 verdict 的 run，单独报分母。
    task：按 task 去重，单独报分母。
    diagnostics：只作回归证据，不进入独立收益分母。
  censoring:
    - "infra_error 仅在预注册的 1 次重试内重试；前后都记录，最终状态计入分母"
    - "pilot 不计入；本清单未预注册 pilot"
    - "诊断任务只作回归证据，不并入新任务的效果宣称"
    - "历史 3 个 FN 是 censored（agent_failure=timeout），不得当作本轮 FN 基线"
  statistics: "每任务每臂 1 rep；只报原始计数与配对方向，不计算显著性、不外推；样本小，零错误放行不能证明改善。"

scoring:
  engine: "官方 featurebench==0.3.0 `fb eval`"
  command_template: >-
    env -u all_proxy -u ALL_PROXY HF_DATASETS_CACHE=/tmp/fb-ac1c/hf-datasets-cache
    FEATUREBENCH_IMAGE_PREFIX=docker.io fb eval -p <predictions.jsonl> --split fast
    --task-id <task_id> --n-concurrent 1 --data-version v1.1 --config-path /tmp/fb-ac1c/config.toml
  predictions_source: "make_predictions.py --arm-dir <arm>=<run 目录>（由 patch.diff 生成）"
  pass_criteria: >-
    gold 补丁在官方评分下 resolved=1 且 empty 补丁 resolved=0（control 通过）才认为该任务
    的评分链路可用；control 失败的任务不得进入效果分母，必须单列并报告。
  source_layer_gold: >-
    人工 gold label 由独立审查者按 Source/Outcome/Oracle 裁定，必须独立于 A/B Actor 生成的
    Spec/Delivery Contract/Verifier 裁决；官方 resolved 只作旁证，不得直接当作用户目标。

