# 实验④扩样本：预注册清单（2026-11-07，首次运行前固定）。
# 规则：5 个已有镜像 repo 里，MVP 与实验②未用过的全部 lv1 任务（fast split 中这 5 个
# repo 没有 lv2），按 repo 顺序 + instance_id 升序全取（12 个），每任务跑 standard 与
# sdlc（SDLC + 固定引导）各 1 次，用于 A/B paired 比较与成本分布；与②的 10 个 B 运行
# 合并可得到 22 个任务的 B 侧样本（时间窗不同，报告里注明）。
