  node_in_container: v24.21.0 (linux-x64 tarball, baked into fb-eval-base)
  provider: deepseek-account
  model: deepseek-flash
  reasoning_effort: max
arms:
  standard:
    preset: 标准模式
    prompt_suffix: ''
  sdlc:
    preset: AI 原生 SDLC
    prompt_suffix: '

      ## Evaluation requirement


      Use the AI-native SDLC workflow for this task before you finish:

      1. create a task with `sdlc_task_create`;

      2. write intent/spec/plan via `sdlc_artifact_write` and advance stages with
      `sdlc_task_advance`;

      3. run `sdlc_verify` before claiming completion and address its findings.

      '
run_policy:
  timeout_seconds: 2700
  max_tokens_per_run: 40000000
  total_token_budget: 350000000
  infra_retries: 1
  agent_retries: 0
  order: alternating
  failure_classes:
  - timeout
  - over_budget
  - infra_error
  - empty_patch
  - agent_error
  - unresolved
