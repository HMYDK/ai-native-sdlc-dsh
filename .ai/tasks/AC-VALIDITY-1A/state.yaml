acceptance: {"version":1,"id":"121193e2-b334-402f-b182-0249fb269d9d","spec_path":"spec.md","spec_sha256":"530c63c629198ffc441c500d613b31f57d01da11cc45fc9e9ea5ad24800c949f","criteria":[{"id":"AC-001","text":"`spec.md` 必需章节增加唯一的 `## Delivery Contract`，位于 `## Acceptance Criteria` 之前；五个 `###` 子节固定为 Source / Outcome / Boundary / Oracle / AC mapping；不新增制品文件、任务阶段、`state.yaml` 或裁决 Schema。"},{"id":"AC-002","text":"`checkArtifact('spec', ...)` 检查 Delivery Contract 及五个子节的缺失、空正文、占位符；空 `###` 标题不能被当作正文；复用现有 findings 与局部解析，不建设通用 Markdown AST / 新 DSL；现有 `parseSpecAcceptance`、AC 注册和 Spec 指纹规则不回归。"},{"id":"AC-003","text":"写作指导/模板和 `docs/artifact-delivery-contract.md` 覆盖正常功能、只修局部接口、原始需求/外部评分冲突三个示例；明确 hidden tests / Grader 不是用户承诺，Source 不可取得时可标记「待确认」，AC mapping 只引用现有 AC ID。"},{"id":"AC-004","text":"同步 `artifact.ts`、`artifact/index.ts`、`artifact.test.ts`、`smoke/artifact.mjs`、`smoke/acceptance.mjs`、`TASK.md`；`npm run verify`（build + test + smoke）通过；旧 AC 解析/登记、旧 Spec/在途任务的兼容影响被如实记录。"},{"id":"AC-005","text":"文档明确结构完整 ≠ 语义充分；`checkAdvance` 不调用 `checkArtifact`，本项不是状态推进硬门禁；不自动重写历史 Spec；AC-003 的行为证据只到「规则/模板 + 示例 + 人工 Review」，真实模型行为交 #22。"}],"registered_at":"2026-11-14T15:41:50.847Z","registered_by":"session-fb0f0629-2caf-4228-a678-b5b65b57c27a"}
