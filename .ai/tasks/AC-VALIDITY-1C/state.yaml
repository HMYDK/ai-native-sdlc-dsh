acceptance: {"version":1,"id":"fb0975c9-ec9d-481e-be73-196fb654d267","spec_path":"spec.md","spec_sha256":"6a331c20378d79ce3d15e049eb9e6b2f97c7de9d117143af5eb5f676acf9a64c","criteria":[{"id":"AC-001","text":"产出独立 case table / ground truth（MD + JSON），覆盖历史诊断与局部接口 vs 外部扩需、正向完成、无关既有失败、原始需求歧义、关键证据缺失；每例含 Source 原文/位置、Outcome/Boundary/Oracle、官方分数（如适用）、Source 与 Grader 一致性、人工预期裁决与不确定性、task/scenario 去重键、unavailable/censored 原因；历史 11 个案例按数据修正为官方 FP 8 runs / 2 任务、官方 FN 3 runs / 2 任务，官方 FP 与 Source 层错误放行分开；gettext/doctest 标 Source/Grader conflict 且 provisional 待审查者；3 个 FN 标 censored；含 Source 依赖核验，且**不写“Source 层已证实 FP=0/FN=0”**。"},{"id":"AC-002","text":"产出可执行离线 fixture，覆盖至少 6 类场景；Phase 1 固定使用 #21 场景 1/2/3（正向通过、明确缺口、范围外独立失败），其余 3 类保留；`check_fixtures.py` 用单一命令物化 repo 并运行真实入口/`unittest`，S1 补“错误包含订单 ID”，S2 失败不是 import error，S3 外部失败不指向目标路径；不新增 Runner，不调用付费模型。"},{"id":"AC-003","text":"产出预注册方案与两份 manifest：主实验 A=`master@920b0eb` vs B2=`dev@5ee68cd`、5 任务 × 2 臂 = **10 runs**；B1=`085c8fd` **单独 manifest**、3 个 sympy × 1 臂 = **3 runs**、不含 sphinx；3 个 sympy 新任务（test_inverse / test_nullspace / test_puiseux）+ 2 个诊断任务；deepseek-flash、DSH 0.2.2-rc.3、ITT/decided/task/run 分母、失败/超时、停止/决策；每臂固定 commit → tarball sha256 → 解包目录 → preset/DSH/镜像；`run_matrix.py`/`run_arm.py` 支持 per-arm plugin dir 与 hash 校验；`check_ac_validity_1c.py --self-test` 负例 fail closed；B1 触发阈值 Phase 0 起草、Phase 2 前批准。"},{"id":"AC-004","text":"产出分阶段预算申请：Phase 0 第二次 verify 1 call / ≤2M / ≤30min / 不重试；Phase 1 3 场景 × 2 臂 = 6 次 verifier 调用 / ≤8M / 2h / 单次 ≤2M；Phase 2 主实验 10 runs / ≤120M / 8h；B1 3 runs / ≤30M / 2h；写清 route/model、调用/run 数、停止条件、费用/墙钟口径；`--only-arm` 不能代替预注册计划。"},{"id":"AC-005","text":"人工 gold label 由审查者最终核对；标签独立于 A/B Actor 生成的 Spec/Delivery Contract/Verifier 裁决；历史 raw 存在时列出归档路径与 sha256，缺失时标 unavailable，不用模型推断补齐；8 个官方 FP 的 Source 层标签为 provisional + conflict，3 个 FN 为 censored；Source 依赖核验只给“未证明是承诺路径必要依赖”，不代替审查者签字；不把官方 resolved 直接当 Source 层结论。"},{"id":"AC-006","text":"产出/更新另一台机器的交接文档，包含已确认决策、Phase 0 成果清单、环境/镜像/归档位置（含 sympy 10.65GB 未拉取）、**两份 manifest**、每臂 commit/tarball sha256/解包目录、image-map、主/B1 strict preflight 命令、Phase 1 fixture/DSH 运行面、Phase 2 命令、预算与审批边界、禁止事项、独立分支 + Draft PR（base `dev@5ee68cd`，不直接合入 dev）、F1–F7 对应。"},{"id":"AC-007","text":"本轮只改文档/案例表/manifest/任务制品，以及 `tools/evals/featurebench` 的 runner/preflight/fixture 与 CI 确定性检查；不改 `packages/sdlc` 插件代码；在 `packages/sdlc/` 运行 `DSH_APP=\"$DSH_APP\" npm run verify`（build + test + smoke）通过；`check_ac_validity_1c.py --self-test`、`check_fixtures.py`、`sanity_check.py --structural` 通过；CI `evals-check` 包含这些确定性检查；不运行 Phase 1/2 付费评测；不宣称减少错误放行或行为已验证，任务不宣称 DONE。"}],"registered_at":"2026-11-15T14:02:18.974Z","registered_by":"session-febe6c27-5def-49f9-b213-bc02e2a9e63e"}
